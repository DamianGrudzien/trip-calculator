name: Deploy to Fly.io

on:
  push:
    branches:
      - claude/trip-calculator-quarkus-backend-at6Kk

jobs:
  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create app if it does not exist yet
        run: flyctl apps create trip-calculator-api --org personal 2>/dev/null || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Push DATABASE_URL secret to Fly
        run: flyctl secrets set DATABASE_URL="${{ secrets.DATABASE_URL }}" --app trip-calculator-api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy
        run: flyctl deploy --remote-only --app trip-calculator-api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
