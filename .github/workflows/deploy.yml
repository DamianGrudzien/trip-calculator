name: Deploy to Render

on:
  push:
    branches:
      - claude/trip-calculator-quarkus-backend-at6Kk

jobs:
  deploy:
    name: Trigger Render deploy
    runs-on: ubuntu-latest

    steps:
      - name: Trigger deploy hook
        run: |
          curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
