# ── Datasource (Neon PostgreSQL – set DATABASE_URL via: fly secrets set DATABASE_URL=...) ──
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DATABASE_URL}
quarkus.datasource.jdbc.additional-jdbc-properties.sslmode=require

# ── Flyway ────────────────────────────────────────────────────────────────────
quarkus.flyway.migrate-at-start=true

# ── Hibernate ─────────────────────────────────────────────────────────────────
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# ── CORS (GitHub Pages + local dev) ───────────────────────────────────────────
quarkus.http.cors=true
quarkus.http.cors.origins=https://damiangrudzien.github.io,http://localhost:3000,http://localhost:8080
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,Accept

# ── HTTP ──────────────────────────────────────────────────────────────────────
quarkus.http.port=${PORT:8080}

# ── OpenAPI ───────────────────────────────────────────────────────────────────
quarkus.smallrye-openapi.path=/api/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/api/swagger-ui

# ── Dev profile ───────────────────────────────────────────────────────────────
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/tripcalculator
%dev.quarkus.datasource.username=tripcalculator
%dev.quarkus.datasource.password=tripcalculator
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.flyway.migrate-at-start=true

# ── Test profile ──────────────────────────────────────────────────────────────
%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.flyway.migrate-at-start=true
